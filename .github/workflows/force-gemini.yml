name: Force Gemini provider

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force Gemini and remove xAI from default path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ai.ts')
          s = p.read_text(encoding='utf-8')
          start = s.index('const DEFAULT_PROVIDER_ORDER: ProviderName[] =')
          end = s.index('\n\nfunction levelLine', start)
          s = s[:start] + 'const DEFAULT_PROVIDER_ORDER: ProviderName[] = ["gemini"];' + s[end:]
          start = s.index('function providerOrder(): ProviderName[] {')
          end = s.index('\n}\n\nasync function readError', start) + 2
          s = s[:start] + '''function providerOrder(): ProviderName[] {
  return ["gemini"];
}''' + s[end:]
          s = s.replace('const apiKey = process.env.GEMINI_API_KEY;\n  if (!apiKey) return null;', 'const apiKey = process.env.GEMINI_API_KEY || process.env.GOOGLE_API_KEY || process.env.GOOGLE_GENERATIVE_AI_API_KEY;\n  if (!apiKey) return { ok: false, error: "Gemini API key is not configured on Vercel." };', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ai.ts
          git commit -m 'fix: force Gemini as the only AI provider'
          git push
